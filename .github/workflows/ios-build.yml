name: iOS Build

on:
  push:
    branches:
      - cloud
      - main
      - develop
  pull_request:
    branches:
      - cloud
      - main
      - develop
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS App
    runs-on: self-hosted
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'
      
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      
      - name: Setup Ruby
        run: |
          # Check if Ruby 2.7.5 is available
          if ! ruby -v | grep -q "2.7.5"; then
            echo "Ruby 2.7.5 not found, checking available versions..."
            ruby -v || echo "Ruby not found"
            
            # Try to install Ruby 2.7.5 via Homebrew/rbenv if available
            if command -v rbenv &> /dev/null; then
              echo "Installing Ruby 2.7.5 via rbenv..."
              rbenv install 2.7.5 || true
              rbenv global 2.7.5 || rbenv local 2.7.5
            elif command -v brew &> /dev/null; then
              echo "Installing Ruby via Homebrew..."
              brew install ruby@2.7 || true
            fi
          fi
          
          # Verify Ruby version
          ruby -v
          
          # Configure gem to use user directory and avoid RVM conflicts
          RUBY_VERSION_SHORT=$(ruby -e 'puts RUBY_VERSION[/\d+\.\d+/]')
          GEM_USER_DIR="$HOME/.gem/ruby/${RUBY_VERSION_SHORT}"
          GEM_BIN_DIR="${GEM_USER_DIR}/bin"
          
          # Create gem user directory if it doesn't exist
          mkdir -p "${GEM_USER_DIR}"
          mkdir -p "${GEM_BIN_DIR}"
          
          # Set GEM_HOME to user directory to force user installs
          export GEM_HOME="${GEM_USER_DIR}"
          export GEM_PATH="${GEM_USER_DIR}"
          
          # Add user gem bin directory to PATH for this step and subsequent steps
          echo "${GEM_BIN_DIR}" >> $GITHUB_PATH
          export PATH="${GEM_BIN_DIR}:${PATH}"
          
          echo "Gem user directory: ${GEM_USER_DIR}"
          echo "Gem bin directory: ${GEM_BIN_DIR}"
          echo "GEM_HOME: ${GEM_HOME}"
          
          # Install bundler to user directory
          if ! command -v bundle &> /dev/null; then
            echo "Installing bundler to user directory..."
            gem install bundler --no-document || {
              echo "⚠️  Failed with --no-document, trying without..."
              gem install bundler
            }
          fi
          
          # Install correct bundler version from Gemfile.lock
          if [ -f "Gemfile.lock" ] && grep -q "BUNDLED WITH" Gemfile.lock; then
            # Get the version from the line after "BUNDLED WITH"
            REQUIRED_BUNDLER=$(grep -A 1 "BUNDLED WITH" Gemfile.lock | tail -1 | xargs)
            if [ -n "${REQUIRED_BUNDLER}" ] && [[ "${REQUIRED_BUNDLER}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Installing bundler version ${REQUIRED_BUNDLER} to user directory..."
              # Check if correct version is already installed
              if bundle --version 2>/dev/null | grep -q "${REQUIRED_BUNDLER}"; then
                echo "✅ Bundler ${REQUIRED_BUNDLER} already installed"
              else
                gem install bundler -v "${REQUIRED_BUNDLER}" --no-document || {
                  echo "⚠️  Failed with --no-document, trying without..."
                  gem install bundler -v "${REQUIRED_BUNDLER}"
                }
              fi
            else
              echo "⚠️  Could not parse bundler version from Gemfile.lock, using latest"
              gem install bundler --no-document || gem install bundler
            fi
          else
            echo "Installing latest bundler to user directory..."
            gem install bundler --no-document || gem install bundler
          fi
          
          # Verify bundler is accessible
          export PATH="${GEM_BIN_DIR}:${PATH}"
          if ! command -v bundle &> /dev/null; then
            echo "⚠️  Bundler not found in PATH, checking installation..."
            ls -la "${GEM_BIN_DIR}/" || echo "Gem bin directory not found"
            echo "Current PATH: ${PATH}"
            echo "Looking for bundle in: ${GEM_BIN_DIR}"
            find "${GEM_USER_DIR}" -name "bundle" -type f 2>/dev/null || echo "Bundle not found"
            exit 1
          fi
          
          echo "✅ Bundler installed successfully"
          bundle --version
      
      - name: Install CocoaPods dependencies
        working-directory: ios
        run: |
          # Configure bundle to use user directory and avoid RVM
          RUBY_VERSION_SHORT=$(ruby -e 'puts RUBY_VERSION[/\d+\.\d+/]')
          GEM_USER_DIR="$HOME/.gem/ruby/${RUBY_VERSION_SHORT}"
          GEM_BIN_DIR="${GEM_USER_DIR}/bin"
          
          # Unset RVM variables that might interfere
          unset GEM_HOME GEM_PATH
          unset MY_RUBY_HOME IRBRC
          unset rvm_bin_path rvm_path rvm_prefix rvm_version
          
          # Set gem environment to user directory
          export GEM_HOME="${GEM_USER_DIR}"
          export GEM_PATH="${GEM_USER_DIR}"
          export PATH="${GEM_BIN_DIR}:${PATH}"
          
          # Create directories if they don't exist
          mkdir -p "${GEM_USER_DIR}"
          mkdir -p "${GEM_BIN_DIR}"
          
          # Configure bundle to install to user directory
          bundle config set --local path "${GEM_USER_DIR}"
          bundle config set --local deployment false
          bundle config unset system
          
          echo "GEM_HOME: ${GEM_HOME}"
          echo "GEM_PATH: ${GEM_PATH}"
          echo "Bundle path: $(bundle config get path)"
          echo "Ruby version: $(ruby -v)"
          echo "Gem env home: $(gem env home)"
          
          # Install gems to user directory
          bundle install --path "${GEM_USER_DIR}"
          
          # Verify bundle can find gems
          bundle exec pod install
      
      - name: Build iOS
        working-directory: ios
        run: |
          xcodebuild clean build \
            -workspace ConverSight.xcworkspace \
            -scheme ConverSight \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
      
      - name: Archive iOS
        working-directory: ios
        run: |
          xcodebuild archive \
            -workspace ConverSight.xcworkspace \
            -scheme ConverSight \
            -configuration Release \
            -archivePath build/ConverSight.xcarchive \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ios-build
          path: ios/build/ConverSight.xcarchive
          retention-days: 7
