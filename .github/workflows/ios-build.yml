name: iOS Build & Upload

on:
  push:
    branches: [main , cloud]
  workflow_dispatch:

jobs:
  ios-build:
    runs-on: macos-14
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Apple Certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          # P12_PASSWORD: The password you set when exporting the .p12 certificate from Keychain Access
          # This is NOT your Mac password - it's the password for the certificate file itself
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          # Validate base64 string is not empty
          if [ -z "$BUILD_CERTIFICATE_BASE64" ]; then
            echo "❌ Error: BUILD_CERTIFICATE_BASE64 secret is empty"
            exit 1
          fi
          
          # Check base64 string length (should be substantial for a .p12 file)
          BASE64_LENGTH=${#BUILD_CERTIFICATE_BASE64}
          echo "Base64 string length: $BASE64_LENGTH characters"
          if [ "$BASE64_LENGTH" -lt 100 ]; then
            echo "❌ Error: Base64 string is too short ($BASE64_LENGTH chars). A valid .p12 certificate should be at least 1000+ characters when base64 encoded."
            echo "Please verify your BUILD_CERTIFICATE_BASE64 secret contains the complete certificate."
            exit 1
          fi
          
          # Decode base64 certificate (macOS base64 uses -d flag)
          # Remove any whitespace/newlines that might be in the base64 string
          echo "$BUILD_CERTIFICATE_BASE64" | tr -d '\n\r ' | base64 -d > $CERTIFICATE_PATH
          
          # Verify the certificate file was created and is not empty
          if [ ! -f "$CERTIFICATE_PATH" ] || [ ! -s "$CERTIFICATE_PATH" ]; then
            echo "❌ Error: Certificate file is missing or empty after base64 decode"
            exit 1
          fi
          
          # Check file size (a valid .p12 should be at least 2KB, typically 5-50KB)
          FILE_SIZE=$(wc -c < $CERTIFICATE_PATH)
          echo "Decoded certificate file size: $FILE_SIZE bytes"
          
          if [ "$FILE_SIZE" -lt 2048 ]; then
            echo "❌ Error: Certificate file is too small ($FILE_SIZE bytes). A valid .p12 certificate should be at least 2KB."
            echo "This usually means the base64 string in BUILD_CERTIFICATE_BASE64 is incomplete or incorrect."
            echo ""
            echo "To fix this, ensure you encode the complete .p12 file:"
            echo "  base64 -i YourCertificate.p12 | pbcopy"
            echo "Then paste the entire output into the BUILD_CERTIFICATE_BASE64 secret."
            exit 1
          fi
          
          # Verify it's a valid PKCS12 file using file command
          FILE_TYPE=$(file "$CERTIFICATE_PATH" 2>/dev/null || echo "unknown")
          echo "File type: $FILE_TYPE"
          
          # Normalize P12_PASSWORD - treat placeholder values as empty
          # GitHub Secrets doesn't allow truly empty values, so we accept placeholders
          NORMALIZED_PASSWORD="$P12_PASSWORD"
          if [ -n "$P12_PASSWORD" ]; then
            # Convert to lowercase and trim whitespace
            NORMALIZED_PASSWORD=$(echo "$P12_PASSWORD" | tr '[:upper:]' '[:lower:]' | xargs)
            # Treat common placeholder values as empty
            if [ "$NORMALIZED_PASSWORD" = "none" ] || [ "$NORMALIZED_PASSWORD" = "empty" ] || [ "$NORMALIZED_PASSWORD" = "nopassword" ] || [ "$NORMALIZED_PASSWORD" = "no-password" ] || [ -z "$NORMALIZED_PASSWORD" ]; then
              NORMALIZED_PASSWORD=""
              echo "ℹ️  Treating P12_PASSWORD placeholder as empty (certificate has no password)"
            fi
          fi
          
          # Validate password before import using openssl (if available)
          if command -v openssl &> /dev/null; then
            echo "Validating certificate password..."
            
            # First, try with the normalized password
            if [ -n "$NORMALIZED_PASSWORD" ] && openssl pkcs12 -info -in "$CERTIFICATE_PATH" -passin pass:"$NORMALIZED_PASSWORD" -noout &>/dev/null; then
              echo "✅ Certificate file is a valid PKCS12 format and password is correct"
            # If that fails, try with empty password (certificate might have no password)
            elif openssl pkcs12 -info -in "$CERTIFICATE_PATH" -passin pass:"" -noout &>/dev/null; then
              echo "✅ Certificate file is valid and has no password"
              echo "ℹ️  Certificate was exported without a password."
              if [ -n "$NORMALIZED_PASSWORD" ]; then
                echo "⚠️  Warning: P12_PASSWORD is set but certificate has no password."
              fi
              # Set normalized password to empty for import
              NORMALIZED_PASSWORD=""
            else
              # Password validation failed - check the error
              OPENSSL_ERROR=$(openssl pkcs12 -info -in "$CERTIFICATE_PATH" -passin pass:"${NORMALIZED_PASSWORD:-}" -noout 2>&1)
              if echo "$OPENSSL_ERROR" | grep -q "Mac verify error\|invalid password\|bad password"; then
                echo "❌ Error: Certificate password is incorrect"
                echo ""
                echo "⚠️  IMPORTANT: P12_PASSWORD is NOT your Mac login password!"
                echo ""
                echo "P12_PASSWORD is the password you set when exporting the .p12 file from Keychain Access."
                echo "This is different from your Mac password."
                echo ""
                echo "To fix this:"
                echo "  1. If you exported WITHOUT a password: Set P12_PASSWORD to 'none' or 'empty' in GitHub secrets"
                echo "     (GitHub doesn't allow empty values, so use 'none' as a placeholder)"
                echo "  2. If you exported WITH a password: Find that password and update P12_PASSWORD"
                echo "  3. If you don't remember: Export a new certificate from Keychain Access"
                echo ""
                echo "To set no password in GitHub (certificate has no password):"
                echo "  - Go to Repository → Settings → Secrets → P12_PASSWORD"
                echo "  - Enter: none (or 'empty' or 'nopassword')"
                echo "  - Save"
                exit 1
              else
                echo "⚠️  Warning: Could not validate certificate format"
                echo "   Error: $OPENSSL_ERROR"
              fi
            fi
          else
            echo "⚠️  openssl not available, skipping password validation"
          fi

          # Create keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # Import certificate into keychain
          echo "Importing certificate into keychain..."
          
          # Disable exit-on-error for import attempts
          set +e
          
          IMPORT_SUCCESS=false
          IMPORT_OUTPUT=""
          IMPORT_EXIT_CODE=1
          
          # Try importing with password
          echo "Attempting import with password..."
          IMPORT_OUTPUT=$(security import "$CERTIFICATE_PATH" \
            -P "$NORMALIZED_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH" \
            -T /usr/bin/codesign \
            -T /usr/bin/security 2>&1)
          IMPORT_EXIT_CODE=$?
          echo "Import exit code: $IMPORT_EXIT_CODE"
          echo "Import output: $IMPORT_OUTPUT"
          
          if [ $IMPORT_EXIT_CODE -eq 0 ]; then
            IMPORT_SUCCESS=true
            echo "✅ Certificate imported successfully with password"
          fi
          
          # If that failed, try without password flag
          if [ "$IMPORT_SUCCESS" = false ]; then
            echo "Attempting import without password flag..."
            IMPORT_OUTPUT=$(security import "$CERTIFICATE_PATH" \
              -A \
              -t cert \
              -f pkcs12 \
              -k "$KEYCHAIN_PATH" \
              -T /usr/bin/codesign \
              -T /usr/bin/security 2>&1)
            IMPORT_EXIT_CODE=$?
            echo "Import exit code: $IMPORT_EXIT_CODE"
            echo "Import output: $IMPORT_OUTPUT"
            
            if [ $IMPORT_EXIT_CODE -eq 0 ]; then
              IMPORT_SUCCESS=true
              echo "✅ Certificate imported successfully without password"
            fi
          fi
          
          # Re-enable exit-on-error
          set -e
          
          if [ "$IMPORT_SUCCESS" = false ]; then
            echo "❌ Error: Failed to import certificate into keychain after multiple attempts"
            echo ""
            echo "Error output from security import:"
            echo "$IMPORT_OUTPUT"
            echo ""
            
            if echo "$IMPORT_OUTPUT" | grep -q "MAC verification failed\|wrong password"; then
              echo "🔐 Password Error: The P12_PASSWORD secret is incorrect."
              echo "  - Update P12_PASSWORD secret with the password you set when exporting"
              echo "  - If no password was set, use 'none' as the value"
            else
              echo "🔧 Common solutions:"
              echo "  1. Verify BUILD_CERTIFICATE_BASE64 contains the full base64 string"
              echo "  2. Ensure P12_PASSWORD matches the export password (9042 in your case)"
              echo "  3. Try exporting a fresh certificate from Keychain Access"
            fi
            exit 1
          fi
          
          # Set keychain as default and include in search list
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          
          # CRITICAL: Allow codesign to access the private key without UI prompts
          # This is required on GitHub-hosted macOS runners
          echo "Setting key partition list for codesign access..."
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"
          echo "✅ Key partition list set"
          
          # Verify certificate was imported
          echo "Verifying certificate import..."
          security find-certificate -c "Apple Distribution" "$KEYCHAIN_PATH" 2>/dev/null || \
          security find-certificate -c "Apple Development" "$KEYCHAIN_PATH" 2>/dev/null || \
          security find-certificate -c "iPhone Developer" "$KEYCHAIN_PATH" 2>/dev/null || \
          echo "⚠️  Warning: Could not verify certificate import by name"
          
          echo "✅ Certificate installation completed"

      - name: Install Provisioning Profile
        env:
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
        run: |
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          
          # Decode base64 provisioning profile (macOS base64 uses -d flag)
          echo "$PROVISIONING_PROFILE_BASE64" | base64 -d > $PP_PATH
          
          # Verify the provisioning profile file was created
          if [ ! -f "$PP_PATH" ] || [ ! -s "$PP_PATH" ]; then
            echo "❌ Error: Provisioning profile file is missing or empty after base64 decode"
            exit 1
          fi
          
          echo "✅ Provisioning profile decoded successfully ($(wc -c < $PP_PATH) bytes)"
          
          # Install provisioning profile
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          
          # Extract UUID from provisioning profile and use it as filename
          UUID=$(grep -aA1 UUID "$PP_PATH" | grep -o "[-A-F0-9]\{36\}" | head -1)
          if [ -n "$UUID" ]; then
            cp "$PP_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/"$UUID.mobileprovision"
            echo "✅ Provisioning profile installed as $UUID.mobileprovision"
          else
            # Fallback: use a generic name
            cp "$PP_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/
            echo "✅ Provisioning profile installed (UUID not found, using generic name)"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'yarn'
      
      - name: Install Node Modules
        run: yarn install --frozen-lockfile
      
      - name: Select Xcode 15.4
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'

      - name: Verify Xcode Version
        run: xcodebuild -version
      
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.0'

      - name: Fix podspec File.exists issue
        run: |
          python3 -c "
          import os

          def fix_file(path):
              with open(path, 'r') as f:
                  content = f.read()
              if 'File.exists?' in content:
                  content = content.replace('File.exists?', 'File.exist?')
                  with open(path, 'w') as f:
                      f.write(content)
                  print(f'Fixed: {path}')

          for root, dirs, files in os.walk('node_modules'):
              for file in files:
                  if file.endswith('.podspec') or file.endswith('.rb'):
                      fix_file(os.path.join(root, file))
          "
          # Also fix Podfile itself
          python3 -c "
          path = 'ios/Podfile'
          with open(path, 'r') as f:
              content = f.read()
          content = content.replace('File.exists?', 'File.exist?')
          with open(path, 'w') as f:
              f.write(content)
          print('Fixed Podfile')"

      - name: Fix boost.podspec URL for checksum issue
        run: |
          BOOST_PODSPEC="node_modules/react-native/third-party-podspecs/boost.podspec"
          if [ -f "$BOOST_PODSPEC" ]; then
            echo "Fixing boost.podspec URL to resolve checksum verification issue..."
            sed -i '' "s|https://boostorg.jfrog.io/artifactory/main/release/1.76.0/source/boost_1_76_0.tar.bz2|https://archives.boost.io/release/1.76.0/source/boost_1_76_0.tar.bz2|g" "$BOOST_PODSPEC"
            sed -i '' "s|'https://boostorg.jfrog.io/artifactory/main/release/1.76.0/source/boost_1_76_0.tar.bz2'|'https://archives.boost.io/release/1.76.0/source/boost_1_76_0.tar.bz2'|g" "$BOOST_PODSPEC"
            sed -i '' 's|"https://boostorg.jfrog.io/artifactory/main/release/1.76.0/source/boost_1_76_0.tar.bz2"|"https://archives.boost.io/release/1.76.0/source/boost_1_76_0.tar.bz2"|g' "$BOOST_PODSPEC"
            echo "✅ Fixed boost.podspec URL"
            if grep -q "archives.boost.io" "$BOOST_PODSPEC"; then
              echo "✅ Verification: boost.podspec URL updated successfully"
              grep "archives.boost.io" "$BOOST_PODSPEC" | head -1
            else
              echo "⚠️  Warning: Could not verify URL change in boost.podspec"
            fi
          else
            echo "⚠️  Warning: boost.podspec not found at $BOOST_PODSPEC"
            find node_modules -name "boost.podspec" -type f 2>/dev/null | head -5 || echo "No boost.podspec found"
          fi

      - name: Install CocoaPods Dependencies
        run: |
          cd ios
          pod install --repo-update

      - name: Build Archive
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          echo "Building iOS archive..."
          echo "Workspace: ios/ConverSight.xcworkspace"
          echo "Scheme: ConverSight"
          echo "Configuration: Release"
          echo "Team ID: $APPLE_TEAM_ID"
          
          xcodebuild -workspace ios/ConverSight.xcworkspace \
            -scheme ConverSight \
            -sdk iphoneos \
            -configuration Release \
            -archivePath $RUNNER_TEMP/ConverSight.xcarchive \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            clean archive
          
          # Verify archive was created
          if [ ! -d "$RUNNER_TEMP/ConverSight.xcarchive" ]; then
            echo "❌ Error: Archive was not created"
            exit 1
          fi
          
          echo "✅ Archive created successfully at $RUNNER_TEMP/ConverSight.xcarchive"
          ls -lh "$RUNNER_TEMP/ConverSight.xcarchive"

      - name: Create ExportOptions.plist
        run: |
          # Create ExportOptions.plist if it doesn't exist
          if [ ! -f "ios/ExportOptions.plist" ]; then
            echo "Creating ExportOptions.plist..."
            cat > ios/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>teamID</key>
              <string>${{ secrets.APPLE_TEAM_ID }}</string>
              <key>uploadBitcode</key>
              <false/>
              <key>uploadSymbols</key>
              <true/>
              <key>compileBitcode</key>
              <false/>
              <key>signingStyle</key>
              <string>manual</string>
          </dict>
          </plist>
          EOF
            echo "✅ ExportOptions.plist created"
          else
            echo "✅ ExportOptions.plist already exists"
          fi

      - name: Export IPA
        run: |
          echo "Exporting IPA from archive..."
          
          # Verify archive exists
          if [ ! -d "$RUNNER_TEMP/ConverSight.xcarchive" ]; then
            echo "❌ Error: Archive not found at $RUNNER_TEMP/ConverSight.xcarchive"
            exit 1
          fi
          
          # Verify ExportOptions.plist exists
          if [ ! -f "ios/ExportOptions.plist" ]; then
            echo "❌ Error: ExportOptions.plist not found"
            exit 1
          fi
          
          # Export IPA
          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/ConverSight.xcarchive \
            -exportOptionsPlist ios/ExportOptions.plist \
            -exportPath $RUNNER_TEMP/output
          
          # Verify IPA was created
          IPA_FILE=$(find $RUNNER_TEMP/output -name "*.ipa" | head -1)
          if [ -z "$IPA_FILE" ]; then
            echo "❌ Error: IPA file was not created"
            exit 1
          fi
          
          echo "✅ IPA exported successfully: $IPA_FILE"
          ls -lh "$IPA_FILE"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ConverSight-iOS-Release
          path: ${{ runner.temp }}/output/*.ipa
          retention-days: 7

      - name: Cleanup Keychain
        if: always()
        run: |
          security delete-keychain $RUNNER_TEMP/app-signing.keychain-db
