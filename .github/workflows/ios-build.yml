name: iOS Build

on:
  push:
    branches:
      - cloud
      - main
      - develop
  pull_request:
    branches:
      - cloud
      - main
      - develop
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS App
    runs-on: self-hosted
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'
      
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      
      - name: Setup Ruby
        run: |
          # Check if Ruby 2.7.5 is available
          if ! ruby -v | grep -q "2.7.5"; then
            echo "Ruby 2.7.5 not found, checking available versions..."
            ruby -v || echo "Ruby not found"
            
            # Try to install Ruby 2.7.5 via Homebrew/rbenv if available
            if command -v rbenv &> /dev/null; then
              echo "Installing Ruby 2.7.5 via rbenv..."
              rbenv install 2.7.5 || true
              rbenv global 2.7.5 || rbenv local 2.7.5
            elif command -v brew &> /dev/null; then
              echo "Installing Ruby via Homebrew..."
              brew install ruby@2.7 || true
            fi
          fi
          
          # Verify Ruby version
          ruby -v
          
          # Install bundler if not available
          if ! command -v bundle &> /dev/null; then
            echo "Installing bundler..."
            gem install bundler
          fi
          
          # Install correct bundler version from Gemfile.lock
          if [ -f "Gemfile.lock" ] && grep -q "BUNDLED WITH" Gemfile.lock; then
            # Get the version from the line after "BUNDLED WITH"
            REQUIRED_BUNDLER=$(grep -A 1 "BUNDLED WITH" Gemfile.lock | tail -1 | xargs)
            if [ -n "${REQUIRED_BUNDLER}" ] && [[ "${REQUIRED_BUNDLER}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Installing bundler version ${REQUIRED_BUNDLER}..."
              gem install bundler -v "${REQUIRED_BUNDLER}"
            else
              echo "⚠️  Could not parse bundler version from Gemfile.lock, using latest"
              gem install bundler
            fi
          else
            echo "Installing latest bundler..."
            gem install bundler
          fi
          
          bundle --version
      
      - name: Install CocoaPods dependencies
        working-directory: ios
        run: |
          bundle install
          bundle exec pod install
      
      - name: Build iOS
        working-directory: ios
        run: |
          xcodebuild clean build \
            -workspace ConverSight.xcworkspace \
            -scheme ConverSight \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
      
      - name: Archive iOS
        working-directory: ios
        run: |
          xcodebuild archive \
            -workspace ConverSight.xcworkspace \
            -scheme ConverSight \
            -configuration Release \
            -archivePath build/ConverSight.xcarchive \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ios-build
          path: ios/build/ConverSight.xcarchive
          retention-days: 7
